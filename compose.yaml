# Postgres local para desenvolvimento e testes da API (AD-001). Credenciais apenas locais.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hackathon -d hackathon']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
